[project]
name = "plagiarism-detected-backend"
version = "0.1.0"
description = "Plagiarism detection + AI/human authenticity prediction API"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ALPHAMAN-0" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Storage
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    # File parsing
    "python-magic>=0.4.27",
    "pypdf>=5.1.0",
    "docx2txt>=0.8",
    "charset-normalizer>=3.3.0",
    # ML / NLP
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.2.0",
    "transformers>=4.46.0",
    "numpy>=1.26.0",
    "nltk>=3.9.0",
    "joblib>=1.4.0",
    # Security / observability
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----- pytest -----
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ----- coverage -----
[tool.coverage.run]
source = ["app"]
omit = [
    "app/ml_models/*",
    "app/__init__.py",
    "app/db/migrations.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
fail_under = 85

# ----- ruff -----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S104",   # hard-coded bind in tests
    "S311",   # pseudo-random generators are fine for non-crypto
    "B008",   # function calls in defaults (FastAPI uses these)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"app/ml_models/*" = ["F401"]

# ----- mypy -----
[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
