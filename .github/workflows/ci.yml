name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Lint (ruff)
        working-directory: backend
        run: |
          uv run ruff check app tests
          uv run ruff format --check

      - name: Type-check (mypy)
        working-directory: backend
        run: uv run mypy app

      - name: Tests with coverage
        working-directory: backend
        run: |
          uv run pytest -q --cov=app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  compose-smoke:
    name: compose smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: pd/api:ci
          load: true

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: pd/web:ci
          load: true

      - name: Smoke /healthz
        run: |
          docker run --rm -d --name pd-api -p 8000:8000 pd/api:ci
          sleep 8
          curl -sf http://localhost:8000/healthz | tee /tmp/healthz.json
          test "$(jq -r .status /tmp/healthz.json)" = "ok"
          docker stop pd-api
