services:
  api:
    build:
      context: ../backend
    image: pd/api:dev
    ports:
      - "8000:8000"
    environment:
      - PD_ENV=development
      - PD_CORS_ALLOW_ORIGINS=http://localhost:8080,http://localhost:5173
      - PD_UPLOADS_DIR=/app/data/uploads
      - PD_INDEXES_DIR=/app/data/indexes
      - PD_MAX_UPLOAD_MB=10
    volumes:
      - ../backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../frontend
    image: pd/web:dev
    ports:
      - "8080:8080"
    environment:
      - VITE_API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
